server:
    # Config Server runs on port 8888
    port: 8888

spring:
    application:
        # Name of this application
        name: config-server
    cloud:
        config:
            server:
                git:
                    # Read configuration from your separate Git repository
                    uri: https://github.com/jakhar0005/Connect-Sphere.git
                    search-paths:
                        - config-repo
                    default-label: master
                    username: ${GITHUB_USERNAME}
                    password: ${GITHUB_TOKEN}

eureka:
    client:
        register-with-eureka: false
        fetch-registry: false