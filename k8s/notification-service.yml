apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service

spec:
  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
      - name: notification-service
        image: jakhar0005/connect-sphere-notification-service

        resources:
          limits:
            memory: "400Mi"
            cpu: "200m"

          requests:
            memory: "200Mi"
            cpu: "100m"

        env:
          - name: SPRING_PROFILES_ACTIVE
            valueFrom:
              configMapKeyRef:
                name: connectsphere-config
                key: SPRING_PROFILES_ACTIVE

          - name: POSTGRES_DB_USERNAME
            valueFrom:
              configMapKeyRef:
                name: connectsphere-config
                key: POSTGRES_DB_USERNAME

          - name: POSTGRES_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: connectsphere-secret
                key: POSTGRES_DB_PASSWORD

          - name: POSTGRES_DB_SERVER
            valueFrom:
              configMapKeyRef:
                name: connectsphere-config
                key: NOTIFICATION_DB_SERVER

          - name: NOTIFICATION_DB_NAME
            valueFrom:
              configMapKeyRef:
                name: connectsphere-config
                key: NOTIFICATION_DB_NAME

          - name: KAFKA_BOOTSTRAP_SERVERS
            valueFrom:
              configMapKeyRef:
                name: connectsphere-config
                key: KAFKA_BOOTSTRAP_SERVERS

        ports:
        - containerPort: 9050

---
apiVersion: v1
kind: Service

metadata:
  name: notification-service

spec:
  selector:
    app: notification-service

  ports:
  - port: 80
    targetPort: 9050